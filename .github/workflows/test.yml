name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[test,lint]"
      - name: Ruff
        run: |
          ruff check src tests scripts --no-fix
          ruff format --check src tests scripts
      - name: Mypy
        run: mypy src tests scripts
      - name: Pytest
        run: pytest tests --cov=src --cov-report=term
