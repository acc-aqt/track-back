name: Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      expect-version:
        description: Version the built tool must report (empty skips the check).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build --outdir dist
      - name: Smoke-test the distributions
        env:
          EXPECT_VERSION: ${{ inputs.expect-version }}
        run: |
          if [ -n "$EXPECT_VERSION" ]; then
            python scripts/smoke_test_dist.py dist --expect-version "$EXPECT_VERSION"
          else
            python scripts/smoke_test_dist.py dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
