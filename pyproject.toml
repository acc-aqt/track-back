[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name =  "track-back"
authors = [
    {name = "Alexander Carrels"},
]
dependencies = [
    "spotipy>=2.25.1,<3",
    "python-dotenv>=1.1.0,<2",
    "fastapi>=0.115.12,<1",
    "pydantic>=2.1.1,<3",
    "uvicorn>=0.34.0,<1",
    "websockets>=15.0.1,<16",
    "httpx>=0.28.1,<1",
    "platformdirs>=4.14.8,<5",
    "segno>=1.6.6,<2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

description = "A game where players sort songs played by release date"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/acc-aqt/track-back"
Source = "https://github.com/acc-aqt/track-back"
Issues = "https://github.com/acc-aqt/track-back/issues"

[project.scripts]
track-back-server = "track_back.server.main:main"


[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
  "coverage",
  "pytest-cov",
  "playwright",
  "pytest-playwright",
]

lint = [
  "ruff==0.17.5",
  "mypy==2.4.1",
]

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
track_back = [
  "web_ui/index.html",
  "web_ui/script.js",
  "web_ui/style.css",
  "web_ui/dummy-cover/*.webp",
  "web_ui/assets/*",
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
 
[tool.ruff.lint]
exclude = ["conf.py", "stubs"]

extend-select = [
  "ARG",  # flake8-unused-arguments
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "C90",  # flake8-mccabe
  "D",    # pydocstyle
  "E",    # pycodestyle
  "ERA",  # eradicate
  "F",    # pyflakes
  "FLY",  # flynt
  "I",    # isort
  "N",    # pep8-naming
  "NPY",  # numpy
  "PD",   # pandas-vet
  "PERF", # perflint
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "TD",   # flake8-todos
  "UP", # pyupgrade
]
ignore = [
  "TD003", # missing issue/link
  "PD011", # Use `.to_numpy()` instead of `.values`
  "PT011", # pytest.raises is too broad
  "E501",  # line length is the formatter's job
]
unfixable = ["ERA001", "F841"] # commented code
 
[tool.ruff.lint.isort]
known-first-party = ["track_back"]
 
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "PLR2004", "S101"]
 
[tool.ruff.lint.pydocstyle]
convention = "numpy"
 
[tool.mypy]
strict = true
show_error_codes = true
show_error_context = true
python_version = "3.11"
ignore_missing_imports = true
 
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 50

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["scripts"]
