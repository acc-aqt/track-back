<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TrackBack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>
      <img class="title-logo" src="assets/logo.svg" alt="" />
      TrackBack
      <img class="title-logo" src="assets/logo.svg" alt="" />
    </h1>

    <div id="controls-server" hidden>
      <!-- Get serverurl by user input if server_config.js does not exist. -->
      <div class="input-group">
        <label for="server">Server&thinsp;🪩</label>
        <input
          type="text"
          id="server"
          value="http://localhost:4200"
        />
      </div>
    </div>
    <div id="controls">
      <div class="input-group">
        <label for="username">Username&thinsp;👩🏻‍🎤</label>
        <input type="text" id="username" />
      </div>
    </div>

    <div id="controls-new-or-join">
      <div class="input-group">
        <button id="configureGameBtn">Configure new Game Session</button>
      </div>
      <div class="input-group">
        <button id="joinGameBtn">Join a Game 👋🏻</button>
      </div>
    </div>

    <div id="joinGameConfigBox" class="config-box" hidden>
      <div id="joinGameTitle" class="config-title">Select game to join</div>

      <div class="input-group">
        <select id="sessionDropdown"></select>
      </div>
      <div class="input-group">
        <button id="joinSelectedSessionBtn">Join Selected Session</button>
      </div>
    </div>

    <div id="gameConfigBox" class="config-box" hidden>
      <div class="config-title">Game Setup 🎮</div>

      <div class="input-group">
        <label id="musicServiceDropdownLabel" for="musicServiceDropdown">
          Choose a music service:
        </label>
        <select id="musicServiceDropdown">
          <option value="spotify">Spotify 📻🎶</option>
          <option value="applemusic">Apple Music 🍎🎶</option>
          <option value="mock">Mock Music Service</option>
        </select>
      </div>

      <div class="input-group">
        <label id="sessionNameInputLabel" for="sessionNameInput">
          Game Session Name:
        </label>
        <input type="text" id="sessionNameInput" />
      </div>

      <div class="input-group">
        <label id="targetSongCountInputLabel" for="targetSongCountInput">
          Target Song Count:
        </label>
        <input
          id="targetSongCountInput"
          type="number"
          value="10"
          min="1"
          step="1"
          required
        />
      </div>

      <div class="input-group">
        <button id="createGameBtn">Create new Game Session</button>
      </div>
    </div>
    <div id="controls-waiting-for-start" hidden>
      <label>Waiting for all players to connect and the game to start...</label>
    </div>

    <div id="controls-start" hidden>
      <div class="input-group">
        <button id="startGameBtn">
          All players connected? Start!<br />
          👩🏻‍🎤👨🏽‍🎤🧑🏻‍🎤👩🏽‍🎤👨🏻‍🎤🧑🏽‍🎤
        </button>
      </div>
    </div>

    <div id="lobby-qr" hidden>
      <label>Friends can scan this to join 📱</label>
      <img id="lobbyQrImg" alt="QR code to join this Game Session" />
      <div class="input-group">
        <button id="lobbyQrToggleBtn" aria-pressed="false">Show bigger</button>
      </div>
    </div>

    <div id="game" style="display: none">
      <div id="winnerHeader" style="display: none"></div>
      <div id="newSongContainer" style="display: none"></div>
      <div id="timelineHeader" class="timeline-header" style="display: none">
        🕰️ 📀 Your TrackBack Timeline 📀 🕰️
      </div>
      <h2 id="songCount" class="timeline-counter" style="display: none">
        Song count: 0
      </h2>
      <div id="songTimeline" class="drop-box" style="display: none"></div>
    </div>
    <div id="logHeader" class="log-header">👩🏻‍🎤📬 Notifications</div>
    <div id="log"></div>
    <script src="script.js"></script>
  </body>
</html>
